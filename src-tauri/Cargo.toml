[package]
name = "dear-to-love"
version = "0.1.0"
description = "Local-first AI story engine"
authors = ["Dear to Love contributors"]
license = "MIT"
repository = "https://github.com/TheMiniMingg/Dear-To-Love"
edition = "2021"
rust-version = "1.90"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "dear_to_love_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
semver = "1"
ts-rs = "12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive", "json"] }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "fs", "time"] }
tokio-util = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }
url = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v7", "serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
zip = { version = "9.4.1", default-features = false, features = ["deflate"] }
fs4 = "0.13"
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["net", "io-util", "test-util"] }
